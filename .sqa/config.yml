config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/adim:
      branch: v0.7.0
      repo: https://github.com/grycap/adim
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/adim git:
        commands:
        - /usr/bin/env sh .sqa/script.sleazy-ultramarine-cow.sh
        container: qc.acc_ugly-lime-bombay
  QC.Doc:
    repos:
      github.com/grycap/adim find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.blurry-seashell-dingo.sh
        container: qc.doc_gloppy-ecru-goat
      github.com/grycap/adim git:
        commands:
        - /usr/bin/env sh .sqa/script.skanky-carmine-fowl.sh
        container: qc.doc_freaky-olivine-walrus
      github.com/grycap/adim markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.sleepy-vermilion-birman.sh
        container: qc.doc_skanky-maroon-flamingo
  QC.Lic:
    repos:
      github.com/grycap/adim licensee:
        commands:
        - /usr/bin/env sh .sqa/script.lousy-cornflower-shrimp.sh
        container: qc.lic_flimsy-chestnut-starfish
  QC.Met:
    repos:
      github.com/grycap/adim validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.tacky-vermilion-angora.sh
        container: qc.met_flabby-lilac-buzzard
  QC.Sec:
    repos:
      github.com/grycap/adim bandit:
        commands:
        - /usr/bin/env sh .sqa/script.wimpy-maroon-gibbon.sh
        container: qc.sec_stinky-cream-moth
  QC.Sty:
    repos:
      github.com/grycap/adim flake8:
        commands:
        - /usr/bin/env sh .sqa/script.blurry-amaranth-fish.sh
        container: qc.sty_gimpy-cerise-frog
      github.com/grycap/adim hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.surly-orange-caterpillar.sh
        container: qc.sty_lumpy-ultramarine-dragon
      github.com/grycap/adim jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.sloppy-red-ostrich.sh
        container: qc.sty_flaky-cinnabar-anteater
  QC.Uni:
    repos:
      github.com/grycap/adim commands:
        commands:
        - /usr/bin/env sh .sqa/script.beady-rose-hummingbird.sh
        container: qc.uni_wheezy-olive-uguisu
  QC.Ver:
    repos:
      github.com/grycap/adim get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.snappy-apricot-guppy.sh
        container: qc.ver_smelly-saffron-wombat
timeout: 5400
